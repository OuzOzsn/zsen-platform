version: '3.8'

services:
  db:
    image: postgres:16
    container_name: zsen-platform-db
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: zsen_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zsen_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nextjs:
    build: .
    container_name: zsen-platform-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/zsen_blog
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: